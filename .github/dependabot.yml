# Dependabot: automated dependency updates (npm + GitHub Actions).
# NOTE: this config cannot be validated locally beyond YAML parsing;
# GitHub validates it on the next push (malformed config surfaces as an
# error under Insights → Dependency graph).
# Update PRs run through .github/workflows/checks.yml automatically
# (astro check + build + npm audit).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly" # monthly over weekly: small dep surface on a static landing page; less PR noise, security updates unaffected
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
