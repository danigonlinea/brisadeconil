name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping queued runs but not in-progress ones.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      # Full history so Gitleaks can scan every commit, not just the head.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check with Astro
        run: npx astro check

      - name: Type-check React islands
        run: npm run typecheck:react

      - name: Lint with ESLint
        run: npm run lint

      # Fail if gallery-manifest.ts is stale relative to the originals in
      # public/gallery/*.jpg.
      #
      # Manifest-only a propósito: los binarios de public/gallery/optimized/
      # NO son byte-reproducibles entre plataformas (libvips re-encodifica
      # distinto según SO/arquitectura), así que un diff binario daría falsos
      # positivos en CI. El manifiesto (LQIP + aspectRatio + dimensiones) es
      # la fuente semántica de la verdad y sí es estable: si alguien añade o
      # quita fotos sin regenerar, el manifiesto diverge y este check lo
      # detecta.
      - name: Check gallery is up to date
        run: |
          npm run optimize:gallery
          if ! git diff --exit-code -- src/data/gallery-manifest.ts; then
            echo "::error::Gallery manifest or optimized images are out of date."
            echo "Run 'npm run optimize:gallery' locally and commit the changes."
            exit 1
          fi

      # Informational only (non-blocking): known placeholders exist today
      # (placeholder testimonials in content files). Flip to blocking once
      # real testimonials land.
      # grep exit codes: 0 = matches found, 1 = no matches, >1 = real error.
      - name: Check for placeholders in content
        shell: bash
        run: |
          set +e
          grep -rn '\[PENDIENTE\|\[PLACEHOLDER\|\[IMAGEN PLACEHOLDER' src/content/
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "::warning::Placeholders found in content files (informational). Resolve them before launch."
          elif [ $status -gt 1 ]; then
            echo "::error::Placeholder check failed to run (grep exit $status)."
            exit 1
          fi

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Detect secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate optimized gallery images
        run: npm run optimize:gallery

      - name: Build Astro site
        run: npm run build
        env:
          # GitHub secret: WEB3FORMS_KEY (Settings > Secrets and variables > Actions)
          # WEB3FORMS_ACCESS_KEY: server-side; la consume el endpoint /api/contact
          # (src/pages/api/contact.ts) para reenviar el formulario a Web3Forms.
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          # PUBLIC_WEB3FORMS_KEY: key pública (client-safe) que el build inyecta en
          # el cliente; ContactForm la usa como fallback cuando el endpoint
          # server-side no está disponible (p. ej. GitHub Pages, hosting estático).
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
